name: grindmode
description: "Study hard. Get roasted. Climb the ranks."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  fl_chart: ^0.70.2
  audioplayers: ^6.0.0
  firebase_storage: ^12.3.3

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  animated_text_kit: ^4.2.2

  # Utils
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  google_sign_in: ^6.2.1
  image_picker: ^1.2.1
  flutter_image_compress: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B4BB5"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/bell.mp3
    - assets/sounds/chime.mp3
    - assets/sounds/alarm.mp3
    - assets/icon/
    - assets/images/anime_1.png
    - assets/images/anime_2.png
    - assets/images/arcade_1.png
    - assets/images/arcade_2.png
    - assets/images/f1_1.png
    - assets/images/f1_2.png
    - assets/images/manga_1.png
    - assets/images/manga_2.png
    - assets/images/nature_1.png
    - assets/images/nature_2.png
